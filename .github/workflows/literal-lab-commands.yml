name: Original lab commands

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Build and observe the original isolated chain-321 lab commands
        type: boolean
        default: false
      node_source:
        description: Pinned node source for the isolated recipe trial
        type: choice
        default: original
        options:
          - original
          - dev-0e80915
          - dev-0e80915-reference
  push:
    branches: [dev, redesign]
    paths:
      - .github/workflows/literal-lab-commands.yml
      - tool/ci/literal_lab_commands.py
      - test/ci/test_literal_lab_commands.py
      - test/ci/test_lab_shutdown.py
      - test/ci/test_lab_frontier.py
      - tools/devnet/lab/lab.sh
      - tools/devnet/lab/Dockerfile.reference
      - tools/devnet/lab/frontier.js
      - tools/devnet/lab/docker-compose.yml
      - tools/devnet/lab/make-assets.js

permissions:
  contents: read

jobs:
  source-controls:
    if: github.repository == 'edgepillar/syrius'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the original test source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -B -c "from pathlib import Path; from tool.ci import literal_lab_commands as lab; root=Path('tools/devnet/lab'); assert all(lab.digest(lab.hosted.regular(root/name)) == pin for name, pin in lab.PINS.items())"
      - name: Test controller contracts without SDK or lab execution
        env:
          SYRIUS_LAB_SHELL_FIXTURE: 'true'
        run: >-
          python -B -c "import unittest; from tool.ci.run_debug_tests import execute_suite;
          raise SystemExit(execute_suite(unittest.TestLoader().discover('test/ci'),
          scope='literal_lab_controller_cases', title='Original lab controller tests',
          wallet_node_scope=True))"
      - name: Revalidate the original test source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  original-lab:
    if: github.event_name == 'workflow_dispatch' && inputs.execute && github.repository == 'edgepillar/syrius'
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Observe original up, status and down commands
        env:
          SYRIUS_LITERAL_LAB: 'true'
          SYRIUS_LITERAL_NODE_SOURCE: ${{ inputs.node_source }}
          SYRIUS_HOSTED_RUNNER: ${{ runner.environment }}
        run: python -B -m tool.ci.literal_lab_commands
