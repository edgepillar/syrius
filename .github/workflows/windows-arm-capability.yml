name: Windows Arm capability

on:
  workflow_dispatch:
  push:
    branches: [redesign]
    paths:
      - .github/workflows/windows-arm-capability.yml
      - tool/ci/windows_container_capability.ps1

permissions:
  contents: read

jobs:
  published-source:
    if: github.event_name == 'push' && github.repository == 'edgepillar/syrius'
    name: Verify published capability source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the published source
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/redesign
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows-container-capability:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'edgepillar/syrius'
    name: Observe finite Windows Arm capability
    runs-on: windows-11-arm
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Observe finite platform facts without installation
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          SYRIUS_WINDOWS_CONTAINER_CAPABILITY: "true"
        run: tool/ci/windows_container_capability.ps1
