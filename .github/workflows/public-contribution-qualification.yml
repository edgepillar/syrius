name: Public Contribution Qualification

on:
  push:
    branches:
      - codex/public-pr-ci-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-checks:
    name: Tests and source checks (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR 15
            head: cd972af0ca73387e0b821415e2ae21e9aa19276c
          - label: PR 16
            head: 4479e2485892548d455d526ac845b044cb531d17
          - label: PR 17
            head: 5f726c8bfdc9d9b89fe1f39cab841ce0d9983357
          - label: PR 18
            head: 54ee664dad166feb19a2c57e2cb7d8598c0487dd
          - label: Combined public contributions
            head: ''
    env:
      SOURCE_HEAD: ${{ matrix.head || github.sha }}
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Checkout the qualification harness
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - name: Checkout the pinned candidate source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate commit, tree and dependency lock
        run: python3 harness/tool/qualify_public_contributions.py bind candidate "$SOURCE_HEAD"
      - name: Set up the pinned Flutter SDK
        uses: ./harness/.github/actions/setup-flutter
      - name: Install locked dependencies
        working-directory: candidate
        run: flutter pub get --enforce-lockfile
      - name: Analyze rearchitecture and services
        working-directory: candidate
        run: flutter analyze --no-pub --no-fatal-infos lib/rearchitecture lib/services
      - name: Run unit and widget tests
        working-directory: candidate
        run: flutter test --no-pub test --exclude-tags chain --reporter expanded
      - name: Check generation cleanliness or exact inherited baseline drift
        run: python3 harness/tool/qualify_public_contributions.py generated candidate "$SOURCE_HEAD"

  release-checksums:
    name: Exact PR 15 checksum fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the qualification harness
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - name: Checkout the pinned PR 15 source
        uses: actions/checkout@v6
        with:
          ref: cd972af0ca73387e0b821415e2ae21e9aa19276c
          path: candidate
          persist-credentials: false
      - name: Validate the exact checksum step with synthetic files
        run: >-
          python3 harness/tool/qualify_public_contributions.py checksums candidate
          cd972af0ca73387e0b821415e2ae21e9aa19276c

  native-builds:
    name: Combined public Release build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-26
          - platform: windows
            runner: windows-latest
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Checkout the combined public source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up the pinned Flutter SDK
        uses: ./.github/actions/setup-flutter
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libnotify-dev libayatana-appindicator3-dev libsecret-1-dev \
            libjsoncpp-dev unzip xz-utils
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build the combined public source in Release mode
        run: flutter build ${{ matrix.platform }} --release --no-pub
      - name: Check relocated Linux plugin paths and packaged SQLite
        if: matrix.platform == 'linux'
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: python3 tool/qualify_public_contributions.py linux-bundle . "$SOURCE_HEAD"
