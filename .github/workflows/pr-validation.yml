name: PR Fast Validation

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-and-test:
    name: Analyze and Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test bounded controllers and lab policy
        timeout-minutes: 3
        run: |
          python3 --version
          python3 -B -m unittest discover -s test/ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install patched package test tools
        working-directory: patched_packages/reown_core-1.3.8
        run: flutter pub get --enforce-lockfile

      - name: Analyze patched package
        working-directory: patched_packages/reown_core-1.3.8
        run: flutter analyze --no-pub

      - name: Analyze application and integration source
        # Existing informational style findings remain visible. Errors and
        # warnings fail this check across the full source tree.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Verify strict selected Dart analysis
        timeout-minutes: 3
        run: python3 -B -m tool.ci.focused_analysis

      - name: Verify Ready surfaces, ownership and restoration
        run: >-
          flutter test test/shaders/entry_field_test.dart
          test/harness/ready_reference_artwork_test.dart
          test/wallet_ready/wallet_ready_test.dart
          test/wallet_ready/wallet_ready_capture_test.dart
          test/go_to_palette/palette_surface_test.dart

      - name: Verify Lock picker symbols and seam refusal
        run: >-
          flutter test test/lock/lock_card_test.dart
          test/lock/wallet_picker_test.dart --no-pub

      - name: Verify compact actions and Token details
        run: >-
          flutter test test/sheen/primary_pill_test.dart
          test/sheen/sheen_test.dart test/staking/view/staking_page_test.dart
          test/token_actions_redesign/token_inline_actions_test.dart --no-pub

      - name: Run unit and widget tests
        run: flutter test test --exclude-tags chain

      - name: Check generated files are up to date
        run: |
          # Generated Dart files are committed in this repository. Regenerating
          # them in CI catches stale JSON/Hive/BDD outputs before they are merged.
          dart run build_runner build
          dart format integration_test
          git diff --exit-code
