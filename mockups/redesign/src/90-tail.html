<script src="vendor/lottie.min.js"></script>
<script>
// Each .scr holds a page body; the shell (title bar, rail, status strip) is added here so it is written once.
const NAV = [
  ['home','Home','home','Ctrl 1'],['transfer','Transfer','send','Ctrl 2'],['staking','Staking','coins','Ctrl 3'],['nodes','Nodes','stack','Ctrl 4'],
  ['plasma','Plasma','zap','Ctrl 5'],['tokens','Tokens','token','Ctrl 6'],['swap','Swap','swap','Ctrl 7'],['az','Accelerator','rocket','Ctrl 8']
];
const NAV2 = [['bell','Notifications','bell',''],['settings','Settings','gear','Ctrl ,'],['lock','Lock','lock','Ctrl L']];
const ico = (n, cls) => `<svg class="i ${cls||''}"><use href="#${n}"/></svg>`;
function rail(on, open, belldot){
  const a = (n,l,i,k) => `<a class="${n===on?'on':''}">${ico(i)}<span>${l}</span>${n==='bell'&&belldot?'<span class="dot"></span>':''}</a>`;
  return `<nav class="rail ${open?'open':''}"><a class="tog">${ico(open?'chevl':'chevr')}</a>${NAV.map(x=>a(...x)).join('')}<span class="gap"></span>${NAV2.map(x=>a(...x)).join('')}</nav>`;
}
function strip(kind){
  let mid = '';
  if (kind==='flight') mid = `<span class="row" style="gap:8px"><span class="dot blue live"></span>Sending 12.5 ZNN <span class="faint">· waiting for a momentum</span></span>`;
  if (kind==='pow') mid = `<span class="row" style="gap:8px"><span class="lot" data-lot="plasma_generation" data-at="0.45" data-loop="1" style="width:18px;height:18px"></span>Generating plasma <span class="num">14 s</span> <span class="faint">· usually about 25 s</span></span>`;
  return `<div class="strip"><span class="row"><span class="dot live"></span><span class="num">#3,281,904</span></span><span>Node <span class="addr">ws://127.0.0.1:35998</span></span><span>Chain <span class="num">1</span></span><span>Peers <span class="num">23</span></span>${mid}<span class="end"><span class="row warn" style="gap:8px">${ico('dl','s')}Syrius 0.3.0 is out<button class="btn xs">Update</button></span></span></div>`;
}
const title = `<div class="title"><span>SYRIUS</span><span><i>&#8212;</i><i>&#9633;</i><i>&#10005;</i></span></div>`;
document.querySelectorAll('.scr').forEach(s => {
  const inner = s.innerHTML;
  if (s.dataset.shell === 'none') {
    s.innerHTML = `<div class="win ${s.dataset.win || ''}">${title}<div class="body">${inner}</div></div>`;
    return;
  }
  const open = s.dataset.rail === 'open';
  const belldot = s.dataset.belldot !== '0';
  const tip = open ? '' : (s.id === 'home-open' ? '' : '');
  s.innerHTML = `<div class="win">${title}<div class="body">${rail(s.dataset.nav, open, belldot)}<main class="col">${inner}${strip(s.dataset.strip)}</main></div></div>`;
});
// the tooltip on the first screen only
(() => { const w = document.querySelector('#home-rest .win'); if (!w) return; const t = document.createElement('div'); t.className='tip'; t.style.top='656px'; t.innerHTML='Notifications'; w.querySelector('.body').appendChild(t); })();
// the zap burst
(() => { const b = document.getElementById('burst'); if (!b) return; for (let i=0;i<28;i++){ const s=document.createElement('i'); const a=Math.random()*Math.PI*2, r=120+Math.random()*160; s.style.setProperty('--dx',(Math.cos(a)*r)+'px'); s.style.setProperty('--dy',(Math.sin(a)*r)+'px'); s.style.animationDelay=(Math.random()*120)+'ms'; b.appendChild(s);} })();

// The wallet's own Lottie files, played by lottie-web 5.12.2 (vendor/, MIT). Each is loaded on first use
// from art/<name>.js, plays when its screen is shown and pauses when it is not. In a screenshot it is
// stopped at data-at, a fraction of its length.
let SHOT = false;
const LOTS = new Map(), waiting = {};
function need(name, cb){
  if (window.LOTTIE_DATA && LOTTIE_DATA[name]) return cb();
  (waiting[name] = waiting[name] || []).push(cb);
  if (waiting[name].length > 1) return;
  const sc = document.createElement('script'); sc.src = 'art/' + name + '.js';
  sc.onload = () => waiting[name].splice(0).forEach(f => f());
  document.head.appendChild(sc);
}
function runLot(el){
  const a = LOTS.get(el); if (!a) return; const d = el.dataset;
  if (!el.closest('.scr').classList.contains('on')) { a.pause(); return; }
  if (SHOT || d.still === '1') { a.goToAndStop(Math.floor(a.totalFrames * (+d.at || 0.99)), true); return; }
  if (d.loop === '1') { if (d.from) a.playSegments([+d.from, +d.to], true); else a.play(); }
  else a.goToAndPlay(+(d.from || 0), true);
}
function initLot(el){
  if (LOTS.has(el)) return; LOTS.set(el, null);
  const d = el.dataset;
  need(d.lot, () => {
    const a = lottie.loadAnimation({ container: el, renderer: 'svg', loop: d.loop === '1', autoplay: false,
      animationData: JSON.parse(JSON.stringify(LOTTIE_DATA[d.lot])),
      rendererSettings: { preserveAspectRatio: d.fit === 'slice' ? 'xMidYMid slice' : 'xMidYMid meet' } });
    LOTS.set(el, a);
    a.addEventListener('DOMLoaded', () => runLot(el));
    if (d.hover === '1') el.addEventListener('mouseenter', () => { if (!SHOT) a.goToAndPlay(+(d.from || 0), true); });
  });
}

const list = document.getElementById('list'), scaler = document.getElementById('scaler'), stage = document.getElementById('stage'), notes = document.getElementById('notes'), ttl = document.getElementById('ttl'), grp = document.getElementById('grp');
const screens = [...document.querySelectorAll('.scr')];
let g = ''; let n = 0;
screens.forEach(s => {
  if (s.dataset.group !== g) { g = s.dataset.group; const h = document.createElement('h2'); h.textContent = g; list.appendChild(h); }
  n++; const a = document.createElement('a'); a.href = '#' + s.id; a.dataset.id = s.id; a.innerHTML = `<i>${String(n).padStart(2,'0')}</i>${s.dataset.title}`; list.appendChild(a);
});
function fit(){ const w = stage.clientWidth; const sc = Math.max(.4, Math.min(1, w / 1282)); scaler.style.transform = 'scale(' + sc + ')'; scaler.style.width = (1282*sc) + 'px'; scaler.style.height = (782*sc) + 'px'; }
function show(id){
  const s = document.getElementById(id); if (!s) return;
  screens.forEach(e => e.classList.toggle('on', e === s));
  list.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  ttl.textContent = s.dataset.title; grp.textContent = s.dataset.group;
  notes.innerHTML = (NOTES[id] || []).map(x => `<li><b>${x[0]}</b>${x[1]}</li>`).join('');
  s.querySelectorAll('.lot').forEach(initLot);
  LOTS.forEach((a, el) => runLot(el));
  try { localStorage.setItem('syrius-redesign-screen', id) } catch (e) {}
}
function theme(t){ document.documentElement.setAttribute('data-theme', t); document.getElementById('t-dark').classList.toggle('on', t==='dark'); document.getElementById('t-light').classList.toggle('on', t==='light'); try { localStorage.setItem('syrius-redesign-theme', t) } catch (e) {} }
document.getElementById('t-dark').onclick = () => theme('dark');
document.getElementById('t-light').onclick = () => theme('light');
list.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); history.replaceState(null, '', '#' + a.dataset.id); show(a.dataset.id); });
addEventListener('resize', fit);
const q = new URLSearchParams(location.search);
if (q.get('shot')) { SHOT = true; document.body.classList.add('shot'); theme(q.get('theme') || 'dark'); show(q.get('shot')); }
else {
  let t = 'dark'; try { t = localStorage.getItem('syrius-redesign-theme') || t } catch (e) {}
  theme(t);
  let start = (location.hash || '').slice(1); if (!document.getElementById(start)) { try { start = localStorage.getItem('syrius-redesign-screen') } catch (e) {} }
  fit(); show(document.getElementById(start) ? start : screens[0].id);
}
